name: 发布契约检查

on:
  pull_request:
    paths:
      - "README.md"
      - "artifacts/**"
      - "docs/**"
      - "gemq/**"
      - "scripts/**"
      - "tests/**"
      - "requirements/**"
      - "pyproject.toml"
      - ".github/workflows/phase9-release.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "artifacts/**"
      - "docs/**"
      - "gemq/**"
      - "scripts/**"
      - "tests/**"
      - "requirements/**"
      - "pyproject.toml"
      - ".github/workflows/phase9-release.yml"

concurrency:
  group: release-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-release-contract:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip numpy scipy pytest
          python -m pip install -e . --no-deps
      - name: Validate published experiment manifests
        run: |
          python scripts/phase9/verify_public_evidence.py --manifest docs/07-release/manifest.json
          python scripts/phase10/verify_public_evidence.py --manifest docs/08-independent-confirmation/manifest.json
          python scripts/prefill/verify_evidence.py --manifest artifacts/prefill/manifest.json
          python scripts/prefill/verify_chunked_evidence.py --manifest artifacts/prefill/p4/manifest.json
          python scripts/vllm/verify_evidence.py --manifest artifacts/vllm/manifest.json
      - name: Compile Python sources
        run: python -m compileall -q gemq scripts tests
      - name: Run CPU reliability tests
        run: |
          python -m pytest -q \
            tests/test_robust_solver.py \
            tests/test_route_proxy.py \
            tests/test_merge_layer_re.py \
            tests/test_phase6_layer_re.py \
            tests/test_phase6_release_evidence.py \
            tests/test_phase10_record_splits.py \
            tests/test_phase10_method_configs.py \
            tests/test_phase10_selection.py \
            tests/test_phase10_independent_test.py \
            tests/test_phase10_public_evidence.py \
            tests/test_h6_summary.py \
            tests/test_phase9_public_evidence.py \
            tests/test_prefill_evidence.py \
            tests/test_chunked_prefill_evidence.py \
            tests/test_concurrent_prefill_contract.py \
            tests/test_vllm_checkpoint_schema.py \
            tests/test_vllm_evidence.py
